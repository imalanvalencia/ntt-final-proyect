<!doctype html>

<html class="dark" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#0053db",
              "primary-container": "#0b192c",
              "surface-container-highest": "#323537",
              "surface-dim": "#101415",
              "on-primary-container": "#75829a",
              background: "#101415",
              "surface-container": "#1d2022",
              "on-secondary-fixed": "#00174b",
              "primary-fixed-dim": "#bac7e1",
              "primary-fixed": "#d6e3fe",
              "on-error-container": "#ffdad6",
              "surface-tint": "#bac7e1",
              "on-secondary": "#002a78",
              "tertiary-fixed": "#6ffbbe",
              "on-tertiary-fixed-variant": "#005236",
              "surface-container-low": "#191c1e",
              surface: "#101415",
              "inverse-on-surface": "#2d3133",
              primary: "#bac7e1",
              secondary: "#b4c5ff",
              "surface-variant": "#323537",
              "on-primary": "#243145",
              "secondary-fixed": "#dbe1ff",
              "tertiary-container": "#001e11",
              "on-tertiary-fixed": "#002113",
              "error-container": "#93000a",
              "inverse-surface": "#e0e3e5",
              error: "#ffb4ab",
              "surface-container-lowest": "#0b0f10",
              "inverse-primary": "#525f75",
              "on-secondary-container": "#cdd7ff",
              "surface-bright": "#363a3b",
              "secondary-fixed-dim": "#b4c5ff",
              "on-error": "#690005",
              "on-secondary-fixed-variant": "#003ea8",
              "on-primary-fixed-variant": "#3a475c",
              "on-tertiary-container": "#009466",
              "on-tertiary": "#003824",
              "on-surface": "#e0e3e5",
              "on-primary-fixed": "#0e1c2f",
              "tertiary-fixed-dim": "#4edea3",
              outline: "#8f9097",
              "on-surface-variant": "#c5c6cd",
              "on-background": "#e0e3e5",
              tertiary: "#4edea3",
              "outline-variant": "#44474c",
              "surface-container-high": "#272a2c",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              base: "8px",
              gutter: "24px",
              "margin-mobile": "16px",
              "bento-gap": "16px",
              "margin-desktop": "48px",
            },
            fontFamily: {
              "body-lg": ["Geist"],
              "body-md": ["Geist"],
              "display-currency": ["Geist"],
              "display-currency-mobile": ["Geist"],
              "headline-md": ["Geist"],
              "label-mono": ["JetBrains Mono"],
              "headline-lg": ["Geist"],
            },
            fontSize: {
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "display-currency": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "display-currency-mobile": [
                "36px",
                { lineHeight: "44px", fontWeight: "700" },
              ],
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "label-mono": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-lg": [
                "32px",
                { lineHeight: "40px", fontWeight: "600" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0b192c; /* Explicitly matching brand requirement */
        color: #e0e3e5;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      .glass-card {
        background: rgba(29, 32, 34, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .pin-dot {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .pin-dot.active {
        background-color: #4edea3;
        box-shadow: 0 0 12px rgba(78, 222, 163, 0.5);
        transform: scale(1.1);
      }
      .numpad-btn:active {
        transform: scale(0.92);
        background-color: rgba(180, 197, 255, 0.15);
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col font-body-md">
    <!-- Top App Bar (Suppressing global nav shell per 'Transactional' rule) -->
    <header
      class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-20 bg-surface/80 backdrop-blur-xl border-b border-white/10"
    >
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-tertiary-fixed-dim text-3xl"
          >account_balance</span
        >
        <span
          class="text-headline-md font-headline-md font-semibold text-on-surface"
          >SmartBank</span
        >
      </div>
      <div
        class="flex items-center gap-2 px-4 py-2 bg-surface-container rounded-full border border-white/5"
      >
        <span
          class="material-symbols-outlined text-tertiary text-sm"
          data-weight="fill"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >verified_user</span
        >
        <span
          class="text-label-mono font-label-mono text-on-surface-variant uppercase tracking-widest text-[10px]"
          >Cifrado de Grado Bancario</span
        >
      </div>
    </header>
    <main
      class="flex-grow flex flex-col items-center justify-center p-margin-mobile gap-8"
    >
      <!-- User Identity Section -->
      <section
        class="flex flex-col items-center gap-6 animate-in fade-in slide-in-from-bottom-4 duration-700"
      >
        <div class="relative group">
          <div
            class="absolute -inset-1 bg-gradient-to-tr from-secondary-container to-tertiary-fixed-dim rounded-full blur opacity-25 group-hover:opacity-40 transition duration-1000"
          ></div>
          <img
            alt="Alan profile"
            class="relative w-28 h-28 md:w-32 md:h-32 rounded-full border-2 border-white/10 object-cover shadow-2xl"
            data-alt="A high-end professional portrait of a man named Alan, shot with shallow depth of field in a modern corporate setting. The lighting is moody and cinematic, emphasizing secure and premium vibes. The background features blurred architectural elements of a luxury bank lobby with a deep navy and electric blue color palette to match the dark-mode aesthetic."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBquWLmHn4NzctCMQ5trAgEdYJ90VZX5Df-vY6U0Ejd9H56Gt0MMi8SAEFzifJcnsAjJBnz8yIng7_Asb1XIrKqCRzSJMqgbP-WSwSIWmVT-XlI2wJPJU0T6LvWi6NA9TbPC6K-NlOy8AFnpRxsN9vflKcJpZhzAPHKgJ53pQUhgDTPO21LA7CNKB7WbFx5qwlBk4uzaypflli3b2bik0nxDKuvPqoXIRAXsbwJECRuGQpP0O2GuiLU--UT1sT160RFAO5Qt79JkX3u"
          />
        </div>
        <div class="text-center">
          <h1 class="text-headline-lg font-headline-lg text-on-surface">
            Bienvenido de nuevo, Alan
          </h1>
          <p class="text-body-md font-body-md text-on-surface-variant mt-1">
            Ingresa tu código PIN para continuar
          </p>
        </div>
        <!-- PIN Masked Display -->
        <div class="flex gap-4 mt-2" id="pin-display">
          <div
            class="w-14 h-16 glass-card rounded-xl flex items-center justify-center"
          >
            <div
              class="pin-dot w-3 h-3 rounded-full bg-on-surface-variant/20"
            ></div>
          </div>
          <div
            class="w-14 h-16 glass-card rounded-xl flex items-center justify-center"
          >
            <div
              class="pin-dot w-3 h-3 rounded-full bg-on-surface-variant/20"
            ></div>
          </div>
          <div
            class="w-14 h-16 glass-card rounded-xl flex items-center justify-center"
          >
            <div
              class="pin-dot w-3 h-3 rounded-full bg-on-surface-variant/20"
            ></div>
          </div>
          <div
            class="w-14 h-16 glass-card rounded-xl flex items-center justify-center"
          >
            <div
              class="pin-dot w-3 h-3 rounded-full bg-on-surface-variant/20"
            ></div>
          </div>
        </div>
      </section>
      <!-- Numeric Keypad / Bento Section -->
      <section
        class="w-full max-w-[440px] grid grid-cols-3 gap-3 p-4 glass-card rounded-[32px]"
      >
        <!-- Row 1-3: Numbers -->
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('1')"
        >
          1
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('2')"
        >
          2
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('3')"
        >
          3
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('4')"
        >
          4
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('5')"
        >
          5
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('6')"
        >
          6
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('7')"
        >
          7
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('8')"
        >
          8
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('9')"
        >
          9
        </button>
        <!-- Bottom Row: Actions -->
        <button
          aria-label="Borrar"
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-error transition-all"
          onclick="deleteKey()"
        >
          <span class="material-symbols-outlined text-2xl">backspace</span>
        </button>
        <button
          class="numpad-btn h-[72px] rounded-2xl flex flex-col items-center justify-center text-headline-md font-headline-md text-on-surface transition-all"
          onclick="pressKey('0')"
        >
          0
        </button>
        <button
          aria-label="Login biométrico"
          class="h-[72px] rounded-2xl flex flex-col items-center justify-center bg-secondary-container text-white shadow-lg active:scale-95 transition-all"
          onclick="biometricLogin()"
        >
          <span class="material-symbols-outlined text-2xl">face</span>
        </button>
      </section>
      <!-- Footer Help -->
      <footer class="mt-4 flex flex-col items-center gap-4">
        <button
          class="text-label-mono font-label-mono text-tertiary-fixed-dim hover:text-tertiary transition-colors tracking-wide"
        >
          ¿OLVIDASTE TU PIN?
        </button>
        <p
          class="text-[12px] text-on-surface-variant opacity-50 font-label-mono"
        >
          SESIÓN PROTEGIDA POR SISTEMA DE CIFRADO CUÁNTICO
        </p>
      </footer>
    </main>
    <!-- Success Modal Overlay (Hidden initially) -->
    <div
      class="fixed inset-0 z-50 bg-background/90 backdrop-blur-3xl flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500"
      id="success-overlay"
    >
      <div class="flex flex-col items-center gap-6 text-center">
        <div
          class="w-24 h-24 rounded-full bg-tertiary-container flex items-center justify-center animate-bounce"
        >
          <span class="material-symbols-outlined text-tertiary text-5xl"
            >lock_open</span
          >
        </div>
        <h2 class="text-headline-lg font-headline-lg">Acceso Concedido</h2>
        <p class="text-body-lg text-on-surface-variant">
          Sincronizando cuentas seguras...
        </p>
      </div>
    </div>
    <script>
      let currentPin = "";
      const MAX_PIN_LENGTH = 4;
      const pinDots = document.querySelectorAll(".pin-dot");

      function updateDisplay() {
        pinDots.forEach((dot, index) => {
          if (index < currentPin.length) {
            dot.classList.add("active");
            dot.classList.remove("bg-on-surface-variant/20");
          } else {
            dot.classList.remove("active");
            dot.classList.add("bg-on-surface-variant/20");
          }
        });

        if (currentPin.length === MAX_PIN_LENGTH) {
          validatePin();
        }
      }

      function pressKey(num) {
        if (currentPin.length < MAX_PIN_LENGTH) {
          currentPin += num;
          updateDisplay();
          // Haptic feedback simulation
          if (window.navigator.vibrate) window.navigator.vibrate(10);
        }
      }

      function deleteKey() {
        currentPin = currentPin.slice(0, -1);
        updateDisplay();
      }

      function validatePin() {
        // Simulated validation
        setTimeout(() => {
          const overlay = document.getElementById("success-overlay");
          overlay.classList.remove("opacity-0", "pointer-events-none");
          overlay.classList.add("opacity-100");

          // Redirect simulation
          setTimeout(() => {
            alert("Acceso verificado. Redirigiendo al Dashboard...");
            // Reset for demo
            currentPin = "";
            updateDisplay();
            overlay.classList.add("opacity-0", "pointer-events-none");
          }, 1500);
        }, 300);
      }

      function biometricLogin() {
        const overlay = document.getElementById("success-overlay");
        overlay.classList.remove("opacity-0", "pointer-events-none");
        overlay.classList.add("opacity-100");
        // Mock face id scanning
        setTimeout(() => {
          alert("Face ID reconocido. Bienvenido Alan.");
          overlay.classList.add("opacity-0", "pointer-events-none");
        }, 2000);
      }
    </script>
  </body>
</html>
